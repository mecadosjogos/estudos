<!doctype html>
<html lang="pt-br">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
	<title>{% block title %}Estudos{% endblock %}</title>
	<link rel="stylesheet" href="/static/style.css">
	<link rel="manifest" href="/static/manifest.json">
	<meta name="theme-color" content="#7c3aed">
</head>
<body>
	{% block nav %}
	<nav class="global-nav">
		<div class="global-nav-inner">
			<a class="button button-ghost" href="/revisao">Revisão</a>
			<a class="button button-ghost" href="/upload">Subir aula</a>
			<a class="button button-ghost" href="/assuntos">Assuntos</a>
			<a class="button button-ghost" href="/termos">Termos</a>
			<a class="button button-ghost" href="/materials">Materiais</a>
			<a class="button button-ghost" href="/works">Biblioteca</a>
			<a class="button button-ghost" href="/dissertativas">Dissertativas</a>
			<a class="button button-ghost" href="/destaques">Destaques em áudio</a>
			<a class="button button-ghost" href="/subjects">Gerenciar matérias</a>
			{% if request.state.user and request.state.user.papel == "admin" %}
			<a class="button button-ghost" href="/admin/seguranca">Segurança</a>
			{% endif %}
			<a class="button button-ghost" href="/conta/senha">Trocar senha</a>
			<form method="post" action="/logout" style="display:inline"><button type="submit" class="button-ghost">Sair</button></form>
		</div>
	</nav>
	{% endblock %}
	<div class="layout">
		{% block content %}{% endblock %}
	</div>
</body>
</html>
